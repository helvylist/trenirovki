цинка и железа не нужны, избыток вреден.</p></div><div class="day"><h2>Анализы</h2><p>Раз в 3 месяца: 25-OH D, ферритин, ТТГ, липидограмма. Яиц в плане много: если ЛПНП выше нормы, сократи яйца и обсуди рацион с врачом. Железо, цинк и B12 принимай только если анализ показал дефицит.</p></div><div class="day"><h2>Не покупать</h2><p>Биотин и «комплексы для волос и ногтей»: без дефицита пользы нет, а биотин искажает анализы (щитовидка, сердце). Коллаген, BCAA, глютамин, бустеры тестостерона, поливитамины «на всё» — маркетинг. Яйца и мясо в плане уже закрывают биотин, цинк и железо.</p></div><div class="day"><h2>Для волос и кожи головы едой</h2><p>Белок около 2 г на кг, яйца и говядина (железо, цинк, B12, биотин), морковь с маслом (каротиноиды усваиваются вместе с жиром), картофель и овощи с витамином C. Жёсткие диеты и резкий дефицит калорий сильнее всего бьют по волосам, поэтому в плане дефицита нет.</p></div>')}
